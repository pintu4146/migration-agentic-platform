version: '3.8'

services:
  redis:
    image: docker.io/redis:7-alpine
    container_name: mig26-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - mig26-network

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: mig26-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - mig26-network

volumes:
  redis-data:
    driver: local
  qdrant-data:
    driver: local

networks:
  mig26-network:
    driver: bridge

